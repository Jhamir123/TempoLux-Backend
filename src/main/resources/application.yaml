server:
  port: 8080
  error:
    include-message: always

spring:
  application:
    name: TempoLux
  main:
    web-application-type: reactive
  docker:
    compose:
      enabled: false
  r2dbc:
    url: r2dbc:postgresql://localhost:5432/TempoLux
    username: postgres
    password: 1234
    pool:
      enabled: true
      initial-size: 5
      max-size: 20
      max-create-connection-time: 5s

jwt:
  secret: TempoLux2026SuperSecretJwtSigningKeyForLuxuryEcommerceReactiveApi_SwissMade_MustBeLongEnough
  expiration: 86400000

groq:
  api:
    key: ${GROQ_API_KEY:gsk_your_groq_api_key_here}
    url: https://api.groq.com/openai/v1/chat/completions
  model: openai/gpt-oss-120b

logging:
  level:
    com.TempoLux: DEBUG
    org.springframework.r2dbc: INFO

mqtt:
  broker-url: ${MQTT_BROKER_URL:tcp://broker.hivemq.com:1883}
  topic: ${MQTT_TOPIC:tempolux/almacen/temperatura}
  client-id: ${MQTT_CLIENT_ID:tempolux-backend}
  qos: ${MQTT_QOS:1}
  connection-timeout-seconds: 10
  keep-alive-interval-seconds: 30

influx:
  url: ${INFLUX_URL:http://127.0.0.1:8086}
  org: ${INFLUX_ORG:tempolux-org}
  bucket: ${INFLUX_BUCKET:telemetry-bucket}
  token: ${INFLUX_TOKEN:tempolux-dev-token-change-me}
  measurement: ${INFLUX_MEASUREMENT:almacen_ambiental}
